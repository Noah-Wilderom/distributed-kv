name: Build Docker image

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  OPENCONTAINER_IMAGE_TITLE: Distributed KV

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.image-ref.outputs.value }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image-name
        run: |
          NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "value=$NAME" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}
          tags: |
            type=raw,value=development,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=dev-,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{raw}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
          labels: |
            org.opencontainers.image.title=${{ env.OPENCONTAINER_IMAGE_TITLE }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - id: apt-cache-buster
        run: echo "value=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APT_CACHE_BUSTER=${{ steps.apt-cache-buster.outputs.value }}

      - id: image-ref
        run: |
          echo "value=${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
